[env]
# This is used to set the minimum deployment target for mac
# https://cmake.org/cmake/help/latest/envvar/MACOSX_DEPLOYMENT_TARGET.html
# If unset, it uses the system one, but we want to build for older versions
# of mac os by default.
#
# This should be kept in sync with the definition of this variable in
# `script/bundle`.
MACOSX_DEPLOYMENT_TARGET = "10.14"

[net]
git-fetch-with-cli = true

# Use the v0 symbol mangling scheme on every target. It encodes generic
# instantiations (which the legacy scheme hashes away irreversibly), improving
# demangled names in backtraces and Sentry symbolication. On wasm the shipped
# bundle strips symbol names, so this only enriches the split-off debug artifact.
[target.'cfg(all())']
rustflags = ["-C", "symbol-mangling-version=v0"]

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-args=-Wl,-headerpad_max_install_names"]

[target.'cfg(target_family = "wasm")']
rustflags = ["--cfg=web_sys_unstable_apis"]

# Static musl build (CLI / remote-server tarball).
# The `-Wl,-headerpad_max_install_names` in `[build].rustflags` is a macOS-only
# linker flag that makes musl-gcc error out; target-specific rustflags fully
# override `[build].rustflags`, so here we keep only the common symbol-mangling
# setting and explicitly enable crt-static to produce a fully static binary that
# does not depend on the host libc.
# The linker defaults to `cc` (provided as `musl-gcc` by musl-tools in CI);
# override with CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER when needed
# (see script/deploy_remote_server).
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "symbol-mangling-version=v0", "-C", "target-feature=+crt-static"]
