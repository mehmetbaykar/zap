# Zap test gate — runs on every push/PR to catch regressions before release.
#
# Mirrors the OS matrix of upstream Warp's ci.yml (macOS / Linux / Windows, fail-fast off,
# command-signatures-v2 excluded everywhere, warp_js additionally excluded on Windows) on free
# GitHub-hosted runners. The pieces of upstream's pipeline that need infrastructure this fork
# doesn't have are intentionally absent: self-hosted/large runners, trunk.io analytics upload,
# and the `integration` package's shell/SSH suites (they need a live sshd + GCP-tunneled test VMs;
# upstream itself skips the SSH ones on fork PRs).
#
# The nextest compile step doubles as the whole-workspace build gate; `warp_tui` is a non-default
# workspace member so it gets its own check (one OS is enough — it's platform-generic).

name: Tests

on:
  push:
    branches:
      - main
      - merge/upstream-catchup
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The fork builds on the inline `oss` channel config (app/src/bin/zap_oss.rs); any other channel
  # makes build.rs call the private warp-channel-config binary and fail. Matches zap_release.yml.
  CHANNEL: oss
  # Same exclusion set as upstream ci.yml: command-signatures-v2 needs its own feature setup and is
  # tested separately by script/presubmit locally.
  WORKSPACE_TEST_ARGS: --workspace --locked --exclude command-signatures-v2

jobs:
  test:
    name: Test (${{ matrix.name }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: linux
            runner: ubuntu-latest
            extra_test_args: ""

          - name: macOS
            os: macos
            runner: macos-latest
            extra_test_args: ""

          - name: Windows
            os: windows
            runner: windows-latest
            # Upstream excludes warp_js on Windows as well.
            extra_test_args: "--exclude warp_js"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Shared setup: rust toolchain (rust-toolchain.toml → 1.92.0), protoc, Git LFS payloads,
      # node/corepack, and the build cache. On Linux install_test_deps also provisions nextest;
      # macOS/Windows get nextest from the dedicated step below (same as upstream ci.yml).
      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: ${{ matrix.os }}
          is_self_hosted: "false"
          install_test_deps: "true"

      - name: Install cargo nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: nextest

      # Compiling every test binary is the whole-workspace build gate (strictly stronger than
      # `cargo check`), mirroring upstream's "Compile tests" step.
      - name: Compile tests
        run: cargo nextest run ${{ env.WORKSPACE_TEST_ARGS }} ${{ matrix.extra_test_args }} --profile ci --no-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the TUI (non-default workspace member)
        if: ${{ matrix.os == 'linux' }}
        run: cargo check -p warp_tui --locked

      # --profile ci: fail-fast off + per-test failure output (see .config/nextest.toml).
      # --retries 2 absorbs the handful of load-sensitive view tests on shared runners.
      - name: Run unit tests
        if: success()
        run: cargo nextest run ${{ env.WORKSPACE_TEST_ARGS }} ${{ matrix.extra_test_args }} --profile ci --retries 2 -E "not package(integration)"
